<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EARSHOT — a sonar hunt in the lightless deep</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23020705'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233dd68c' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%23b4ffd9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23eafff4'/%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #010403;
      overflow: hidden;
      cursor: crosshair;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #010403;
    }
    canvas#game {
      display: block;
      background: #020705;
      image-rendering: auto;
    }
    /* CRT overlay: scanlines + slow phosphor flicker. Sits above the canvas, ignores the mouse. */
    #crt {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #crt::before {
      content: "";
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.16) 0px,
        rgba(0, 0, 0, 0.16) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    #crt::after {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 75% 65% at 50% 48%,
        transparent 0%,
        transparent 62%,
        rgba(0, 6, 4, 0.55) 100%);
      animation: crtflicker 4.1s infinite;
    }
    @keyframes crtflicker {
      0%   { opacity: 1.0; }
      52%  { opacity: 0.94; }
      54%  { opacity: 1.0; }
      71%  { opacity: 0.97; }
      100% { opacity: 1.0; }
    }
    #boot {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      color: #2c8f68;
      font-family: monospace;
      font-size: 18px;
      letter-spacing: 0.35em;
      z-index: 5;
      text-shadow: 0 0 12px rgba(61, 214, 140, 0.5);
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1920" height="1080"></canvas>
  </div>
  <div id="crt"></div>
  <div id="boot">POWERING SONAR SUITE…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
